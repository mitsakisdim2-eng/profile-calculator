<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 10px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .panel-title {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .btn-info {
            background: #4dabf7;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
            width: auto;
        }

        .btn-info:hover {
            background: #339af0;
        }

        .btn-warning {
            background: #ffa94d;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
        }

        .btn-warning:hover {
            background: #ff922b;
        }

        .item-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13px;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #333;
        }

        .item-detail {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        .item-actions {
            display: flex;
            gap: 4px;
        }

        .result-item {
            background: #f0f7ff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            word-break: break-all;
        }

        .no-results {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }

        .results-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn, .print-btn {
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .print-btn {
            background: #51cf66;
        }

        .print-btn:hover {
            background: #40c057;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
        }

        .form-section {
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .form-section-title {
            font-weight: 600;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .export-section {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .export-section-title {
            font-weight: 600;
            font-size: 12px;
            color: #92400e;
            margin-bottom: 8px;
        }

        .export-section button {
            font-size: 11px;
            padding: 6px 10px;
            width: auto;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .modal-header h2 {
            font-size: 18px;
            color: #333;
        }

        .modal-close {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #ee5a52;
        }

        /* Print preview styles */
        .print-preview {
            background: white;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        .print-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .print-header h1 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .print-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .print-table th {
            background-color: #667eea;
            color: white;
            padding: 8px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #333;
        }

        .print-table td {
            padding: 8px;
            border: 1px solid #ddd;
        }

        .print-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .print-page-break {
            page-break-after: always;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px dashed #999;
        }

        .print-footer {
            text-align: right;
            font-size: 10px;
            color: #666;
            margin-top: 10px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .modal, .modal-content {
                position: static;
                max-height: none;
                box-shadow: none;
            }
            .print-page-break {
                page-break-after: always;
            }
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Library Management Panel -->
        <div class="panel">
            <div class="panel-title">Library Management</div>
            
            <div class="form-section">
                <div class="form-section-title">Categories</div>
                <div class="form-group">
                    <label for="categoryInput">Category Name</label>
                    <div class="input-row">
                        <input type="text" id="categoryInput" placeholder="e.g., Window Frames">
                        <button class="btn-success btn-small" onclick="addCategory()">Add</button>
                    </div>
                </div>
                <div class="item-list" id="categoryList"></div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Profiles</div>
                <div class="form-group">
                    <label for="categorySelect">Select Category</label>
                    <select id="categorySelect" onchange="loadProfilesForCategory()"></select>
                </div>
                <div class="form-group">
                    <label for="profileInput">Profile Name</label>
                    <div class="input-row">
                        <input type="text" id="profileInput" placeholder="e.g., Aluminum 6063">
                        <button class="btn-success btn-small" onclick="addProfile()">Add</button>
                    </div>
                </div>
                <div class="item-list" id="profileList"></div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Operations for Profile</div>
                <div class="form-group">
                    <label for="operationSelect">Select Profile</label>
                    <select id="operationSelect" onchange="loadOperationsForProfile()"></select>
                </div>
                <div class="form-group">
                    <label for="operationInput">Formula</label>
                    <textarea id="operationInput" placeholder="e.g., (value - 192) / 2"></textarea>
                </div>
                <div class="form-group">
                    <label for="suffixInput">Suffix</label>
                    <input type="text" id="suffixInput" placeholder="e.g., x2">
                </div>
                <button class="btn-success" onclick="addOperation()">Add Operation</button>
                <div class="item-list" id="operationList"></div>
            </div>

            <div class="export-section">
                <div class="export-section-title">Data Management</div>
                <button class="btn-info" onclick="exportLibrary()">Export Library</button>
                <button class="btn-warning" onclick="importLibrary()">Import Library</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="handleImportFile()">
            </div>
        </div>

        <!-- Calculate Panel -->
        <div class="panel">
            <div class="panel-title">Calculate Cutting Instructions</div>
            
            <div class="form-group">
                <label for="calcCategorySelect">Select Category</label>
                <select id="calcCategorySelect" onchange="loadCalculateProfiles()">
                    <option value="">-- Choose Category --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="calcProfileSelect">Select Profile</label>
                <select id="calcProfileSelect">
                    <option value="">-- Choose Profile --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="suffixOverride">Suffix Override (optional)</label>
                <input type="text" id="suffixOverride" placeholder="Leave empty to use profile defaults">
            </div>

            <div class="form-group">
                <label for="valuesInput">Values (one per line, format: "number-id")</label>
                <textarea id="valuesInput" placeholder="e.g., 1500-001&#10;915-002&#10;610-003"></textarea>
            </div>

            <button class="btn-primary" onclick="calculate()">Calculate</button>
            <button class="print-btn" onclick="openPrintPreview()">Print Preview</button>

            <div class="form-group" style="margin-top: 20px;">
                <label>Results</label>
                <div class="results-container" id="resultsContainer">
                    <div class="no-results">No calculations yet</div>
                </div>
            </div>

            <button class="copy-btn" onclick="copyResults()">Copy Results</button>
        </div>
    </div>

    <!-- Print Preview Modal -->
    <div id="printModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Print Preview - ΚΟΠΕΣ</h2>
                <button class="modal-close" onclick="closePrintPreview()">&times;</button>
            </div>
            <div id="printPreviewContent" class="print-preview"></div>
            <button class="btn-primary" style="margin-top: 20px;" onclick="window.print()">Print</button>
        </div>
    </div>

    <script>
        // Data structure
        let library = {
            categories: [],
            profiles: {},
            operations: {}
        };

        let lastResults = [];

        // Initialize
        function init() {
            loadLibraryFromStorage();
            renderCategories();
            updateAllSelects();
        }

        // Storage Management
        function loadLibraryFromStorage() {
            const stored = localStorage.getItem('profileLibrary');
            if (stored) {
                library = JSON.parse(stored);
            }
        }

        function saveLibraryToStorage() {
            localStorage.setItem('profileLibrary', JSON.stringify(library));
        }

        // Category Management
        function addCategory() {
            const input = document.getElementById('categoryInput');
            const name = input.value.trim();
            if (!name) {
                alert('Please enter a category name');
                return;
            }
            if (library.categories.includes(name)) {
                alert('Category already exists');
                return;
            }
            library.categories.push(name);
            library.profiles[name] = [];
            library.operations[name] = {};
            saveLibraryToStorage();
            input.value = '';
            renderCategories();
            updateAllSelects();
        }

        function deleteCategory(category) {
            if (confirm(`Delete category "${category}"?`)) {
                library.categories = library.categories.filter(c => c !== category);
                delete library.profiles[category];
                delete library.operations[category];
                saveLibraryToStorage();
                renderCategories();
                updateAllSelects();
            }
        }

        function renderCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';
            library.categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <span class="item-name">${cat}</span>
                    <button class="btn-danger btn-small" onclick="deleteCategory('${cat}')">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        // Profile Management
        function loadProfilesForCategory() {
            const select = document.getElementById('categorySelect');
            const category = select.value;
            renderProfiles(category);
            loadOperationsForProfile();
        }

        function renderProfiles(category) {
            const list = document.getElementById('profileList');
            list.innerHTML = '';
            if (!category) {
                list.innerHTML = '<div class="no-results">Select a category first</div>';
                return;
            }
            const profiles = library.profiles[category] || [];
            profiles.forEach(profile => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <span class="item-name">${profile}</span>
                    <button class="btn-danger btn-small" onclick="deleteProfile('${category}', '${profile}')">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function addProfile() {
            const category = document.getElementById('categorySelect').value;
            const input = document.getElementById('profileInput');
            const name = input.value.trim();
            if (!category) {
                alert('Please select a category first');
                return;
            }
            if (!name) {
                alert('Please enter a profile name');
                return;
            }
            if (library.profiles[category].includes(name)) {
                alert('Profile already exists');
                return;
            }
            library.profiles[category].push(name);
            library.operations[category][name] = [];
            saveLibraryToStorage();
            input.value = '';
            renderProfiles(category);
            updateOperationSelect();
        }

        function deleteProfile(category, profile) {
            if (confirm(`Delete profile "${profile}"?`)) {
                library.profiles[category] = library.profiles[category].filter(p => p !== profile);
                delete library.operations[category][profile];
                saveLibraryToStorage();
                renderProfiles(category);
                updateOperationSelect();
            }
        }

        // Operation Management
        function loadOperationsForProfile() {
            updateOperationSelect();
            renderOperations();
        }

        function updateOperationSelect() {
            const category = document.getElementById('categorySelect').value;
            const select = document.getElementById('operationSelect');
            select.innerHTML = '<option value="">-- Select Profile --</option>';
            if (category && library.profiles[category]) {
                library.profiles[category].forEach(profile => {
                    const option = document.createElement('option');
                    option.value = profile;
                    option.textContent = profile;
                    select.appendChild(option);
                });
            }
        }

        function renderOperations() {
            const category = document.getElementById('categorySelect').value;
            const profile = document.getElementById('operationSelect').value;
            const list = document.getElementById('operationList');
            list.innerHTML = '';
            if (!category || !profile) {
                list.innerHTML = '<div class="no-results">Select a category and profile first</div>';
                return;
            }
            const ops = library.operations[category][profile] || [];
            ops.forEach((op, idx) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div>
                        <div class="item-name">Formula: ${op.formula}</div>
                        <div class="item-detail">Suffix: ${op.suffix}</div>
                    </div>
                    <button class="btn-danger btn-small" onclick="deleteOperation('${category}', '${profile}', ${idx})">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function addOperation() {
            const category = document.getElementById('categorySelect').value;
            const profile = document.getElementById('operationSelect').value;
            const formula = document.getElementById('operationInput').value.trim();
            const suffix = document.getElementById('suffixInput').value.trim();
            
            if (!category || !profile) {
                alert('Please select a category and profile first');
                return;
            }
            if (!formula) {
                alert('Please enter a formula');
                return;
            }
            if (!suffix) {
                alert('Please enter a suffix');
                return;
            }
            
            if (!library.operations[category][profile]) {
                library.operations[category][profile] = [];
            }
            library.operations[category][profile].push({ formula, suffix });
            saveLibraryToStorage();
            document.getElementById('operationInput').value = '';
            document.getElementById('suffixInput').value = '';
            renderOperations();
        }

        function deleteOperation(category, profile, idx) {
            if (confirm('Delete this operation?')) {
                library.operations[category][profile].splice(idx, 1);
                saveLibraryToStorage();
                renderOperations();
            }
        }

        // Calculate
        function calculate() {
            const category = document.getElementById('calcCategorySelect').value;
            const profile = document.getElementById('calcProfileSelect').value;
            const suffixOverride = document.getElementById('suffixOverride').value.trim();
            const valuesInput = document.getElementById('valuesInput').value.trim();

            if (!category) {
                alert('Please select a category');
                return;
            }
            if (!profile) {
                alert('Please select a profile');
                return;
            }
            if (!valuesInput) {
                alert('Please enter values');
                return;
            }

            const operations = library.operations[category][profile] || [];
            if (operations.length === 0) {
                alert('No operations defined for this profile');
                return;
            }

            const lines = valuesInput.split('\n').map(l => l.trim()).filter(l => l);
            lastResults = [];

            lines.forEach(line => {
                const [valueStr, id] = line.split('-');
                const value = parseFloat(valueStr);
                if (isNaN(value)) return;

                operations.forEach(op => {
                    try {
                        const result = eval(op.formula.replace(/value/g, value));
                        const suffix = suffixOverride || op.suffix;
                        lastResults.push({
                            value,
                            id,
                            formula: op.formula,
                            result: Math.round(result),
                            suffix
                        });
                    } catch (e) {
                        console.error('Formula error:', e);
                    }
                });
            });

            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            if (lastResults.length === 0) {
                container.innerHTML = '<div class="no-results">No results</div>';
                return;
            }
            container.innerHTML = '';
            lastResults.forEach(r => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.textContent = `${r.result}${r.suffix} (ID: ${r.id})`;
                container.appendChild(item);
            });
        }

        function copyResults() {
            if (lastResults.length === 0) {
                alert('No results to copy');
                return;
            }
            const text = lastResults.map(r => `${r.result}${r.suffix} (ID: ${r.id})`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('Results copied to clipboard');
            });
        }

        // Print Preview
        function openPrintPreview() {
            if (lastResults.length === 0) {
                alert('No results to print');
                return;
            }

            // Group results by ID
            const grouped = {};
            lastResults.forEach(r => {
                if (!grouped[r.id]) grouped[r.id] = [];
                grouped[r.id].push(r);
            });

            // Generate print content with A4 pagination (approx 35 rows per page)
            const rowsPerPage = 35;
            let html = '';
            let rowCount = 0;
            let pageNum = 1;

            Object.keys(grouped).forEach(id => {
                const items = grouped[id];
                
                items.forEach((item, idx) => {
                    if (rowCount === 0) {
                        if (pageNum > 1) html += '<div class="print-page-break"></div>';
                        html += `
                            <div class="print-header">
                                <h1>ΚΟΠΕΣ - Σελίδα ${pageNum}</h1>
                            </div>
                            <table class="print-table">
                                <thead>
                                    <tr>
                                        <th>ΜΗΚΟΣ (mm)</th>
                                        <th>ΤΕΜΑΧΙΑ</th>
                                        <th>ID</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        pageNum++;
                    }

                    html += `
                        <tr>
                            <td>${item.result}</td>
                            <td>1</td>
                            <td>${id}</td>
                        </tr>
                    `;
                    rowCount++;

                    if (rowCount >= rowsPerPage) {
                        html += '</tbody></table>';
                        rowCount = 0;
                    }
                });
            });

            if (rowCount > 0) {
                html += '</tbody></table>';
            }

            document.getElementById('printPreviewContent').innerHTML = html;
            document.getElementById('printModal').classList.add('active');
        }

        function closePrintPreview() {
            document.getElementById('printModal').classList.remove('active');
        }

        // Calculate panel updates
        function loadCalculateProfiles() {
            const category = document.getElementById('calcCategorySelect').value;
            const select = document.getElementById('calcProfileSelect');
            select.innerHTML = '<option value="">-- Choose Profile --</option>';
            if (category && library.profiles[category]) {
                library.profiles[category].forEach(profile => {
                    const option = document.createElement('option');
                    option.value = profile;
                    option.textContent = profile;
                    select.appendChild(option);
                });
            }
        }

        // Update all select dropdowns
        function updateAllSelects() {
            // Category select in library
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="">-- Select Category --</option>';
            library.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                catSelect.appendChild(option);
            });

            // Category select in calculate
            const calcCatSelect = document.getElementById('calcCategorySelect');
            calcCatSelect.innerHTML = '<option value="">-- Choose Category --</option>';
            library.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                calcCatSelect.appendChild(option);
            });
        }

        // Export/Import
        function exportLibrary() {
            const json = JSON.stringify(library, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'profile-library.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importLibrary() {
            document.getElementById('importFile').click();
        }

        function handleImportFile() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    library = JSON.parse(e.target.result);
                    saveLibraryToStorage();
