<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 10px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .btn-info {
            background: #4dabf7;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
            width: auto;
        }

        .btn-info:hover {
            background: #339af0;
        }

        .btn-warning {
            background: #ffa94d;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
        }

        .btn-warning:hover {
            background: #ff922b;
        }

        .item-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13px;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #333;
        }

        .item-detail {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        .item-actions {
            display: flex;
            gap: 4px;
        }

        .result-item {
            background: #f0f7ff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            word-break: break-all;
        }

        .no-results {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }

        .results-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
        }

        .form-section {
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .form-section-title {
            font-weight: 600;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .export-section {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .export-section-title {
            font-weight: 600;
            font-size: 12px;
            color: #92400e;
            margin-bottom: 8px;
        }

        .export-section button {
            font-size: 11px;
            padding: 6px 10px;
            width: auto;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Panel: Library Management -->
        <div class="panel">
            <div class="panel-title">📚 Library</div>

            <!-- Export/Import Section -->
            <div class="export-section">
                <div class="export-section-title">⚙️ Library Management</div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn-info" onclick="exportLibrary()">Export</button>
                    <button class="btn-info" onclick="importLibrary()">Import</button>
                </div>
            </div>

            <!-- Profiles Section -->
            <div class="form-group">
                <label>Profiles</label>
                <div class="item-list" id="profilesList"></div>
                <button class="btn-primary btn-small" onclick="startAddProfile()" style="width: 100%;">+ Add Profile</button>
            </div>

            <!-- Profile Form (Hidden) -->
            <div id="profileFormContainer" style="display: none; border: 1px solid #ddd; padding: 12px; border-radius: 4px; margin-bottom: 10px;">
                <div class="form-section-title">Profile Name</div>
                <div class="form-group">
                    <input type="text" id="profileNameInput" placeholder="Enter profile name">
                </div>

                <div class="form-section-title">Assign Operations</div>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="margin-bottom: 8px;">Available Operations</label>
                    <div id="operationsCheckboxList" style="max-height: 120px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 8px;">
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button class="btn-success" style="flex: 1;" onclick="saveProfile()">Save</button>
                    <button class="btn-danger" style="flex: 1;" onclick="cancelProfileForm()">Cancel</button>
                </div>
            </div>

            <!-- Operations Section -->
            <div class="form-group">
                <label>Operations</label>
                <div class="item-list" id="operationsList"></div>
                <button class="btn-primary btn-small" onclick="startAddOperation()" style="width: 100%;">+ Add Operation</button>
            </div>

            <!-- Operation Form (Hidden) -->
            <div id="operationFormContainer" style="display: none; border: 1px solid #ddd; padding: 12px; border-radius: 4px; margin-bottom: 10px;">
                <div class="form-section-title">Operation Name</div>
                <div class="form-group">
                    <input type="text" id="operationNameInput" placeholder="Enter operation name">
                </div>

                <div class="form-group">
                    <label>Formula</label>
                    <input type="text" id="operationFormula" placeholder="e.g., (value - 192) / 2">
                    <small style="color: #666; font-size: 11px;">Use 'value' as placeholder</small>
                </div>
                <div class="form-group">
                    <label>Suffix</label>
                    <input type="text" id="operationSuffix" placeholder="e.g., x2">
                </div>
                <div class="form-group">
                    <label>Decimal Places</label>
                    <input type="number" id="operationPrecision" min="0" max="5" value="1">
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-success" style="flex: 1;" onclick="saveOperation()">Save</button>
                    <button class="btn-danger" style="flex: 1;" onclick="cancelOperationForm()">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Calculator -->
        <div class="panel">
            <div class="panel-title">⚙️ Calculate</div>

            <div class="form-group">
                <label>Profile</label>
                <select id="profileSelect" onchange="onProfileChange()">
                    <option value="">Select profile...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Values (one per line)</label>
                <textarea id="inputValues" placeholder="1500-001&#10;1400-002&#10;1300-003"></textarea>
            </div>

            <button class="btn-primary" onclick="calculate()">Calculate</button>

            <div class="form-group" style="margin-top: 20px;">
                <label>Results</label>
                <div class="results-container" id="results">
                    <div class="no-results">Results will appear here</div>
                </div>
                <button class="copy-btn" id="copyBtn" style="display: none;" onclick="copyResults()">📋 Copy</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="handleFileImport(event)">

    <script>
        // DEFAULT LIBRARY - This is saved in the code and loaded on first visit
        const DEFAULT_LIBRARY = {
            profiles: [],
            operations: []
        };

        // Data storage
        let library = {
            profiles: [],
            operations: []
        };

        let currentProfileName = null;
        let currentOperationName = null;
        let currentProfileOperations = [];
        let isEditingProfile = false;
        let isEditingOperation = false;

        // Load from localStorage or use default
        function loadLibrary() {
            const saved = localStorage.getItem('profileLibrary');
            if (saved) {
                library = JSON.parse(saved);
            } else {
                library = JSON.parse(JSON.stringify(DEFAULT_LIBRARY));
                saveLibrary();
            }
            renderProfiles();
            renderOperations();
        }

        // Save to localStorage AND update the code
        function saveLibrary() {
            localStorage.setItem('profileLibrary', JSON.stringify(library));
            // Auto-download backup
            downloadLibraryBackup();
        }

        // Export library to JSON file
        function exportLibrary() {
            const dataStr = JSON.stringify(library, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `profile-library-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Download library as backup
        function downloadLibraryBackup() {
            const dataStr = JSON.stringify(library, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'profile-library-backup.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        // Import library from JSON file
        function importLibrary() {
            document.getElementById('fileInput').click();
        }

        // Handle file import
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.profiles && imported.operations) {
                        library = imported;
                        saveLibrary();
                        renderProfiles();
                        renderOperations();
                        updateProfileSelect();
                        alert('Library imported successfully!');
                    } else {
                        alert('Invalid library file format');
                    }
                } catch (err) {
                    alert('Error reading file: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Start Add Profile
        function startAddProfile() {
            isEditingProfile = false;
            currentProfileName = null;
            currentProfileOperations = [];
            document.getElementById('profileNameInput').value = '';
            document.getElementById('profileNameInput').focus();
            updateOperationsCheckboxList();
            document.getElementById('profileFormContainer').style.display = 'block';
        }

        // Start Edit Profile
        function startEditProfile(name) {
            isEditingProfile = true;
            const profile = library.profiles.find(p => p.name === name);
            currentProfileName = name;
            currentProfileOperations = [...profile.operations];
            document.getElementById('profileNameInput').value = name;
            updateOperationsCheckboxList();
            document.getElementById('profileFormContainer').style.display = 'block';
        }

        // Update Operations Checkbox List
        function updateOperationsCheckboxList() {
            const container = document.getElementById('operationsCheckboxList');
            if (library.operations.length === 0) {
                container.innerHTML = '<div class="no-results">No operations available</div>';
                return;
            }
            container.innerHTML = library.operations.map(op => `
                <div style="padding: 6px; border-bottom: 1px solid #eee; display: flex; align-items: center;">
                    <input type="checkbox" id="op-${op.name}" value="${op.name}" 
                           ${currentProfileOperations.includes(op.name) ? 'checked' : ''}
                           style="width: auto; margin-right: 8px;">
                    <label for="op-${op.name}" style="margin: 0; font-weight: normal; font-size: 12px; cursor: pointer;">
                        ${op.name} (${op.formula})
                    </label>
                </div>
            `).join('');
        }

        // Save Profile
        function saveProfile() {
            const name = document.getElementById('profileNameInput').value.trim();

            if (!name) {
                alert('Enter profile name');
                return;
            }

            // Check for duplicate names (but allow editing the same name)
            if (!isEditingProfile && library.profiles.find(p => p.name === name)) {
                alert('Profile already exists');
                return;
            }

            const checkboxes = document.querySelectorAll('#operationsCheckboxList input[type="checkbox"]:checked');
            currentProfileOperations = Array.from(checkboxes).map(cb => cb.value);

            if (currentProfileOperations.length === 0) {
                alert('Select at least one operation');
                return;
            }

            if (isEditingProfile) {
                // Update existing profile
                const index = library.profiles.findIndex(p => p.name === currentProfileName);
                library.profiles[index] = {
                    name: name,
                    operations: currentProfileOperations
                };
            } else {
                // Add new profile
                library.profiles.push({
                    name: name,
                    operations: currentProfileOperations
                });
            }

            saveLibrary();
            renderProfiles();
            updateProfileSelect();
            cancelProfileForm();
        }

        // Cancel Profile Form
        function cancelProfileForm() {
            document.getElementById('profileFormContainer').style.display = 'none';
            currentProfileName = null;
            currentProfileOperations = [];
            isEditingProfile = false;
        }

        // Delete Profile
        function deleteProfile(name) {
            if (confirm(`Delete profile "${name}"?`)) {
                library.profiles = library.profiles.filter(p => p.name !== name);
                saveLibrary();
                renderProfiles();
                updateProfileSelect();
            }
        }

        // Render Profiles
        function renderProfiles() {
            const container = document.getElementById('profilesList');
            if (library.profiles.length === 0) {
                container.innerHTML = '<div class="no-results">No profiles yet</div>';
                return;
            }
            container.innerHTML = library.profiles.map(p => `
                <div class="item">
                    <div>
                        <div class="item-name">${p.name}</div>
                        <div class="item-detail">Operations: ${p.operations.join(', ')}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-warning btn-small" onclick="startEditProfile('${p.name}')">Edit</button>
                        <button class="btn-danger btn-small" onclick="deleteProfile('${p.name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Start Add Operation
        function startAddOperation() {
            isEditingOperation = false;
            currentOperationName = null;
            document.getElementById('operationNameInput').value = '';
            document.getElementById('operationFormula').value = '';
            document.getElementById('operationSuffix').value = '';
            document.getElementById('operationPrecision').value = '1';
            document.getElementById('operationNameInput').focus();
            document.getElementById('operationFormContainer').style.display = 'block';
        }

        // Start Edit Operation
        function startEditOperation(name) {
            isEditingOperation = true;
            const operation = library.operations.find(o => o.name === name);
            currentOperationName = name;
            document.getElementById('operationNameInput').value = name;
            document.getElementById('operationFormula').value = operation.formula;
            document.getElementById('operationSuffix').value = operation.suffix;
            document.getElementById('operationPrecision').value = operation.precision;
            document.getElementById('operationFormContainer').style.display = 'block';
        }

        // Save Operation
        function saveOperation() {
            const name = document.getElementById('operationNameInput').value.trim();
            const formula = document.getElementById('operationFormula').value.trim();
            const suffix = document.getElementById('operationSuffix').value.trim();
            const precision = parseInt(document.getElementById('operationPrecision').value) || 1;

            if (!name) {
                alert('Enter operation name');
                return;
            }

            if (!formula) {
                alert('Enter formula');
                return;
            }

            // Check for duplicate names (but allow editing the same name)
            if (!isEditingOperation && library.operations.find(o => o.name === name)) {
                alert('Operation already exists');
                return;
            }

            if (isEditingOperation) {
                // Update existing operation
                const index = library.operations.findIndex(o => o.name === currentOperationName);
                library.operations[index] = {
                    name: name,
                    formula,
                    suffix,
                    precision
                };
            } else {
                // Add new operation
                library.operations.push({
                    name: name,
                    formula,
                    suffix,
                    precision
                });
            }

            saveLibrary();
            renderOperations();
            renderProfiles(); // Re-render profiles in case operations list changed
            cancelOperationForm();
        }

        // Cancel Operation Form
        function cancelOperationForm() {
            document.getElementById('operationFormContainer').style.display = 'none';
            document.getElementById('operationNameInput').value = '';
            document.getElementById('operationFormula').value = '';
            document.getElementById('operationSuffix').value = '';
            document.getElementById('operationPrecision').value = '1';
            currentOperationName = null;
            isEditingOperation = false;
        }

        // Delete Operation
        function deleteOperation(name) {
            if (confirm(`Delete operation "${name}"?`)) {
                library.operations = library.operations.filter(o => o.name !== name);
                library.profiles = library.profiles.map(p => ({
                    ...p,
                    operations: p.operations.filter(op => op !== name)
                }));
                saveLibrary();
                renderOperations();
                renderProfiles();
                updateProfileSelect();
            }
        }

        // Render Operations
        function renderOperations() {
            const container = document.getElementById('operationsList');
            if (library.operations.length === 0) {
                container.innerHTML = '<div class="no-results">No operations yet</div>';
                return;
            }
            container.innerHTML = library.operations.map(o => `
                <div class="item">
                    <div>
                        <div class="item-name">${o.name}</div>
                        <div class="item-detail">${o.formula} ${o.suffix}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-warning btn-small" onclick="startEditOperation('${o.name}')">Edit</button>
                        <button class="btn-danger btn-small" onclick="deleteOperation('${o.name}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Update Profile Select
        function updateProfileSelect() {
            const select = document.getElementById('profileSelect');
            const current = select.value;
            select.innerHTML = '<option value="">Select profile...</option>' +
                library.profiles.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
            select.value = current;
        }

        // Profile Select Changed
        function onProfileChange() {
            document.getElementById('inputValues').value = '';
            document.getElementById('results').innerHTML = '<div class="no-results">Results will appear here</div>';
            document.getElementById('copyBtn').style.display = 'none';
        }

        // Calculate
        function calculate() {
            const profileName = document.getElementById('profileSelect').value;
            const inputValuesText = document.getElementById('inputValues').value.trim();

            if (!profileName) {
                alert('Select a profile');
                return;
            }

            if (!inputValuesText) {
                alert('Enter at least one value');
                return;
            }

            const profile = library.profiles.find(p => p.name === profileName);
            if (!profile || profile.operations.length === 0) {
                alert('Profile has no operations');
                return;
            }

            try {
                const allResults = [];
                const lines = inputValuesText.split('\n').filter(line => line.trim());

                for (const line of lines) {
                    const parts = line.trim().split('-');
                    const value = parseFloat(parts[0]);
                    const tag = parts.slice(1).join('-') || '';

                    if (isNaN(value)) continue;

                    for (const operationName of profile.operations) {
                        const operation = library.operations.find(o => o.name === operationName);
                        if (!operation) continue;

                        const calc = new Function('value', `return ${operation.formula}`);
                        let result = calc(value);

                        result = Math.round(result * Math.pow(10, operation.precision)) / Math.pow(10, operation.precision);
                        const formatted = result.toFixed(operation.precision);

                        let output = `${formatted}${operation.suffix}`;
                        if (tag) {
                            output += `-${tag}`;
                        }

                        allResults.push({
                            operation: operationName,
                            value: value,
                            tag: tag,
                            output: output
                        });
                    }
                }

                const resultsDiv = document.getElementById('results');
                if (allResults.length === 0) {
                    resultsDiv.innerHTML = '<div class="no-results">No valid values</div>';
                    document.getElementById('copyBtn').style.display = 'none';
                } else {
                    resultsDiv.innerHTML = allResults.map(r => 
                        `<div class="result-item">${r.output}</div>`
                    ).join('');
                    document.getElementById('copyBtn').style.display = 'block';
                    document.getElementById('copyBtn').dataset.results = allResults.map(r => r.output).join('\n');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Copy Results
        function copyResults() {
            const results = document.getElementById('copyBtn').dataset.results;
            navigator.clipboard.writeText(results).then(() => {
                const btn = document.getElementById('copyBtn');
                const original = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = original;
                }, 2000);
            });
        }

        // Initialize
        loadLibrary();
        updateProfileSelect();

        // Allow Ctrl+Enter to calculate
        document.getElementById('inputValues').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
